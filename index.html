<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <title>AS Travel</title>
    <!--
        Apply the persisted theme synchronously, before first paint, so the
        boot splash below doesn't flash light-then-dark. Mirrors the default
        in src/helpers/theme.js (light unless 'as.theme' is explicitly 'dark').
    -->
    <script>
        try {
            if (localStorage.getItem('as.theme') === 'dark') {
                document.documentElement.classList.add('dark');
            }
        } catch (e) {
            // localStorage unavailable (private mode) — fall back to light.
        }
    </script>
    <style>
        @keyframes boot-splash-fly {
            0% { left: -20%; opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }
        .boot-splash-plane {
            animation: boot-splash-fly 1.6s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <!--
        Static boot splash: matches src/components/Loader.vue so there's no
        visual jump. Rendered as the initial content of #app, so Vue's
        mount('#app') replaces it automatically — no cleanup JS needed. This
        covers the JS-download/parse/exec + first render window; app.css is
        render-blocking in the production build, so Tailwind + the .dark
        remap above are already active by the time this paints.
    -->
    <div id="app">
        <div class="flex min-h-screen flex-col items-center justify-center gap-2">
            <span class="select-none text-center text-lg font-bold leading-tight">
                <span class="text-red-600">AS</span> <span class="text-gray-700">Travel</span>
            </span>
            <div class="relative h-7 w-40 overflow-hidden">
                <svg class="boot-splash-plane absolute top-1/2 h-7 w-7 -translate-y-1/2 text-red-500" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z" />
                </svg>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
